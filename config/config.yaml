output:
  format: json
  include_timestamp: true
  output_dir: output
  pretty_print: true
  verbose: false
scanner:
  max_retries: 3
  proxy: null
  rate_limit: 10.0
  timeout: 30
  user_agent: AgentSecurityScanner/0.1
  verify_ssl: true
