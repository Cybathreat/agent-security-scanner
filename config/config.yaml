logging:
  compression: zip
  format: '{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {function} | {message}'
  level: INFO
  retention: 7 days
  rotation: 10 MB
  serialize: false
modules:
  adaptive_generator_scanner:
    attacker_llm_api_key: null
    attacker_llm_endpoint: null
    attacker_llm_model: null
    compliance_threshold: 0.6
    enabled: true
    max_iterations: 5
    mutation_branches: 3
    pruning_threshold: 0.3
    request_delay: 0.5
    test_adaptive: true
  auth_scanner:
    compliance_threshold: 0.6
    enabled: true
    request_delay: 0.5
    test_api_keys: true
    test_brute_force: true
    test_mfa: true
    test_session_fixation: true
    test_token_leakage: true
    test_unauthenticated: true
  cors_scanner:
    compliance_threshold: 0.6
    enabled: true
    request_delay: 0.5
    test_allowed_headers: true
    test_allowed_methods: true
    test_credentials_with_wildcard: true
    test_custom_origins: []
    test_preflight: true
    test_wildcard_origin: true
  dependency_audit_scanner:
    compliance_threshold: 0.6
    enabled: true
    request_delay: 0.5
    test_cve: true
    test_malicious: true
    test_outdated: true
  direct_injection_scanner:
